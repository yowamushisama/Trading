[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btc-bot"
version = "0.1.0"
description = "Production-grade BTC trading bot — survives first, profits second"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "ccxt>=4.3",
    "python-binance>=1.0.19",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "httpx>=0.27",
    "feedparser>=6.0",
    # LLM providers (all optional at runtime; controlled by LLM_PROVIDER env var)
    "anthropic>=0.28",
    "openai>=1.30",
    "groq>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/btc_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/btc_bot/risk", "src/btc_bot/execution"]
branch = true

[tool.coverage.report]
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
